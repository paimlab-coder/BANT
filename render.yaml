services:
  - type: web
    name: radar-bsa
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATA_DIR
        value: /var/data
    disk:
      name: radar-bsa-data
      mountPath: /var/data
      sizeGB: 1
